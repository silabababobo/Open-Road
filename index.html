{const q=new URLSearchParams(location.search).get('room');if(q){$('rc').value=q;$('mp').click()}}

function syncPeer(p){const d=p.presence;if(!Number.isFinite(d.x)||!Number.isFinite(d.z))return;const c=Number.isFinite(d.c)?d.c:0x888888,n=String(d.n||'Player').slice(0,12);let o=others.get(p.peer);

function onMsg(m,w){
  if(m.t==='room'){rcode=m.code;tryN=0;wxT=1e9;if(Number.isFinite(m.gt))gt=m.gt;rt=+m.rt||0;const ids=new Set((m.players||[]).map(p=>p.id));others.forEach((o,k)=>{if(!ids.has(k)){S.remove(o.m);others.delete(k)}});chip();$('go').click()}
  else if(m.t==='s'&&typeof m.id==='string'&&m.id!==myid)syncPeer({peer:m.id,presence:m});
  else if(m.t==='j'){toast((m.n||'Player')+' เข้าห้อง');chip()}
  else if(m.t==='l'){const o=others.get(m.id);if(o){toast(o.n+' ออกจากห้อง');S.remove(o.m);others.delete(m.id)}chip()}
  else if(m.t==='w'){if(Number.isFinite(m.gt))gt=m.gt;rt=+m.rt||0}
  else if(m.t==='pong'){ping=Math.max(0,Date.now()-m.ts);chip()}
  else if(m.t==='err'){w.gotErr=1;st2(m.m||'เกิดข้อผิดพลาด');w.close()}}
function connect(first){
  if(!/^https?:$/.test(location.protocol)){st2('ต้องเปิดเกมผ่านเซิร์ฟเวอร์ (npm start แล้วเปิด http://localhost:3000)');return}
  leaving=0;st2('กำลังเชื่อมต่อเซิร์ฟเวอร์...');const old=ws;const w=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  if(old&&old!==w)try{old.close()}catch(e){}
  const to=setTimeout(()=>{if(w.readyState!==1)w.close()},12000);
  w.onopen=()=>{clearTimeout(to);send(first)};
  w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onMsg(m,w)};
  w.onclose=()=>{clearTimeout(to);if(w!==ws||leaving)return;
    if(rcode){if(tryN<10){tryN++;chip('เชื่อมต่อใหม่...');setTimeout(()=>{if(!leaving&&w===ws)connect({t:'join',code:rcode,n:nick(),id:myid})},Math.min(4000,400*tryN))}else{dropAll();st2('หลุดจากเซิร์ฟเวอร์')}}
    else if(!w.gotErr)st2('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ')}}
function netStep(dt){const k=Math.min(1,dt*9);others.forEach(o=>{o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;o.yw+=Math.atan2(Math.sin(o.ty-o.yw),Math.cos(o.ty-o.yw))*k;o.m.position.set(o.x,gcar(o.x,o.z),o.z);o.m.rotation.y=o.yw;o.m.wh.forEach(w=>w.rotation.x-=o.v*dt/.38);
  const dx=car.x-o.x,dz=car.z-o.z,dd=Math.hypot(dx,dz);if(!paused&&dd<4.3&&dd>.01){car.x+=dx/dd*(4.3-dd)*.5;car.z+=dz/dd*(4.3-dd)*.5;car.v*=1-Math.min(1,dt*3)}});
  const t=performance.now();if(ws&&ws.readyState===1&&rcode){if(t-lastNet>80){lastNet=t;send({t:'s',x:+car.x.toFixed(1),z:+car.z.toFixed(1),y:+car.yaw.toFixed(2),v:+car.v.toFixed(1),c:sv.col,n:sv.nick||nick()})}if(t-lastPing>3000){lastPing=t;send({t:'ping',ts:Date.now()})}}}

const E=[0,14,26,38,50,64];let last=performance.now(),fr=0,acc=0;
function tick(now){requestAnimationFrame(tick);const dt0=Math.min(.05,(now-last)/1e3),dt=paused?0:dt0;last=now;
acc+=dt;if(++fr==90){if(acc/fr>.03&&pr>1){pr=Math.max(1,pr-.25);R.setPixelRatio(pr);R.setSize(innerWidth,innerHeight)}fr=0;acc=0}
gt=(gt+dt/240)%1;wxUpdate(dt);setTime();
const th=playing&&(K.G||K.ArrowUp||K.w)?1:0,br=playing&&(K.B||K.ArrowDown||K.s)?1:0,st=playing?((K.L||K.ArrowLeft||K.a?1:0)-(K.R||K.ArrowRight||K.d?1:0)):0;
let v=car.v;const fx=-Math.sin(car.yaw),fz=-Math.cos(car.yaw),[d]=near(car.x,car.z),off=d>6.3;
let a=0;if(th)a+=v<0?14:13*(1+.12*sv.pw)*(1-Math.min(v,75+6*sv.pw)/(75+6*sv.pw));if(br)a-=v>.5?26:(v>-9?5:0);a-=.0007*v*Math.abs(v)+Math.sign(v)*1.2;
a-=(gcar(car.x+fx*2,car.z+fz*2)-gcar(car.x,car.z))/2*9.8*(v>0?1:-1);if(off){a-=v*.6;if(v>28)a-=6}
v+=a*dt;if(!th&&!br&&Math.abs(v)<.3)v=0;
car.steer+=(st-car.steer)*Math.min(1,dt*7);const del=car.steer*.5*(1+.12*sv.st)/(1+Math.abs(v)/10),lim=Math.min(1.8,(15-5*rn)*(1+.1*sv.st)/Math.max(Math.abs(v),1));

car.x+=fx*v*dt;car.z+=fz*v*dt;const r=Math.hypot(car.x,car.z);if(r>740){car.x*=740/r;car.z*=740/r;v*=.9}
ai.forEach(q=>{q.u=(q.u+q.dir*q.v*dt/loopLen+1)%1;const f=q.u*(loopS.length-2),i=Math.floor(f),p0=loopS[i],p1=loopS[i+1],t=f-i;
let tx_=p1.x-p0.x,tz=p1.z-p0.z;const l=Math.hypot(tx_,tz)||1;tx_/=l;tz/=l;const x=p0.x+(p1.x-p0.x)*t-tz*2.7*q.dir,z=p0.z+(p1.z-p0.z)*t+tx_*2.7*q.dir;
q.m.position.set(x,gcar(x,z),z);q.m.rotation.y=Math.atan2(-tx_*q.dir,-tz*q.dir);q.m.wh.forEach(w=>w.rotation.x-=q.v*dt/.38);
const dx=car.x-x,dz=car.z-z,dd=Math.hypot(dx,dz);if(dd<4.3){car.x+=dx/dd*(4.3-dd)*.6;car.z+=dz/dd*(4.3-dd)*.6;v*=1-Math.min(1,dt*4)}});
car.v=v;
const gy=gcar(car.x,car.z),rx=-fz,rz=fx;car.y+=(gy-car.y)*Math.min(1,dt*18);

// camera + shadow light
